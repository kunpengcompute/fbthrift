name: PR-Pipeline_fbthrift

on: # 自动触发工作流运行的触发条件
  #workflow_dispatch:            # 界面手动运行
  pull_request_target:           # MR 事件触发默认分支配置文件
    types: ["open", "reopen", "update"]
    branches: [ "*" ]
  pr_comment:                    # PR 评论触发
    types: [ created ]
    keyword: '^(?:\/)?compile*'
  pull_request_comment:          # 标准 PR 评论触发事件
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' , 'sca-pr-scan']

concurrency: # 并发控制（必须用 GitCode 原生语法，GitHub 的 group/cancel-in-progress 会静默吞事件）
  enable: true
  max: 3
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

permissions:
  repository: read               # 顶层只声明基础读权限；id-token 按需下沉到具体作业

env:
  pr_id: ${{ atomgit.event.pull_request.number }}
  branch: ${{ atomgit.event.pull_request.base.ref }}
  default_branch: ${{ atomgit.event.repository.default_branch }}

stages:
  stage0: # 流水线状态管理（非项目逻辑）
    name: 初始化阶段
    select: selected_by_default
    jobs:
      associate_pr_comment:
        name: associate_pr_comment
        runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=small ]
        steps:
          - name: associate pr comment
            uses: associate-pr-comment

      init_pipeline_status:
        name: init_pipeline_status
        runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=small ]
        steps:
          - name: Set running label
            uses: openlibing/pr-label-action@v1.0.0
            with:
              add_labels: ci-pipeline-running
              remove_labels: ci-pipeline-passed,ci-pipeline-failed
              token: ${{ secrets.PR_LABEL_TOKEN }}

  stage1: # 校验阶段
    name: 校验阶段
    select: selected_by_default
    jobs:
      # 纯文档 PR 跳过 build/ut 的门控作业（必备）
      Detect_file_changes:
        name: Detect_file_changes
        runs-on: ["ubuntu-latest", "x64", "slim"]
        outputs:
          need_build: ${{ steps.set-skip.outputs.need_build }}
        steps:
          - name: checkout
            uses: checkout
            with:
              # 检出预合并引用需显式放行（pwn request 防护）
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              fetch-depth: 0
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: 'pull_request'
              base: ${{ env.branch }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                doc-only:
                  - '**/*.md'
                  - '**/*.rst'
                  - '**/*.log'
                  - '**/*.png'
                  - '**/*.jpg'
                  - '**/*.doc'
                  - '**/*.eddx'
                  - '**/*.svg'
          - name: set build skip flag
            id: set-skip
            run: |
              echo "changed: ${{ steps.filter.outputs.changed_files }}"
              echo "doc-only: ${{ steps.filter.outputs.doc-only }}"
              if [ "${{ steps.filter.outputs.doc-only }}" = "true" ]; then
                echo "need_build=no" >> "$ATOMGIT_OUTPUT"
              else
                echo "need_build=yes" >> "$ATOMGIT_OUTPUT"
              fi

      sca-pr:
        name: sca-pr
        runs-on: ["ubuntu-latest", "x64", "slim"]
        permissions:
          id-token: write     # 仅本作业需要 OIDC 令牌
        steps:
          - name: sca-pr
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: "boostkit"

      malicious-scan:
        name: malicious-scan
        runs-on: ["ubuntu-latest", "x64", "slim"]
        permissions:
          id-token: write     # 仅本作业需要 OIDC 令牌
        steps:
          - name: malicious-scan
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              project-name: "boostkit"

      build:
        name: build
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        needs: [ Detect_file_changes, sca-pr, malicious-scan ]
        uses: .gitcode/workflows/build_job.yml
        with:
          runs_on_flavor: "flavor=xlarge"
          docker_img: "swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/debian12:fbthrift_26.3.0.01"
          pr_id: "${{ env.pr_id }}"
          branch: "${{ env.branch }}"
          default_branch: "${{ env.default_branch }}"

      ut: # 形态①：ut 独立构建，不依赖 build 制品
        name: ut
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        needs: [ Detect_file_changes, sca-pr, malicious-scan ]
        uses: .gitcode/workflows/ut_job.yml
        with:
          runs_on_flavor: "flavor=xlarge"
          docker_img: "swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/debian12:fbthrift_26.3.0.01"
          pr_id: "${{ env.pr_id }}"
          branch: "${{ env.branch }}"
          default_branch: "${{ env.default_branch }}"

post: # 流水线结束状态管理
  jobs:
    update_pipeline_status:
      name: update_pipeline_status
      runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=small ]
      steps:
        - name: Set result label
          uses: openlibing/pr-label-action@v1.0.0
          with:
            add_labels: ${{ pipeline.upstream_status == 'COMPLETED' && 'ci-pipeline-passed' || 'ci-pipeline-failed' }}
            remove_labels: ci-pipeline-running,${{ pipeline.upstream_status == 'COMPLETED' && 'ci-pipeline-failed' || 'ci-pipeline-passed' }}
            token: ${{ secrets.PR_LABEL_TOKEN }}
