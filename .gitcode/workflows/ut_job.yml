name: UT Job

on:
  workflow_call:
    inputs:
      runs_on_flavor:
        required: true
        type: string
      docker_img:
        required: true
        type: string
      pr_id:
        required: true
        type: string
      branch:            # PR 目标分支（主文件 Detect_file_changes 的 base 用）
        required: true
        type: string
      default_branch:    # 默认分支（脚本回退 checkout 用）
        required: true
        type: string

jobs:
  JOB_Compile:
    name: UT
    select: selected_by_default
    runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, "${{ inputs.runs_on_flavor }}" ]
    container:
      image: ${{ inputs.docker_img }}
    steps:
      - name: fast_checkout
        identifier: fast_checkout
        uses: checkout
        with:
          allow-unsafe-pr-checkout: true
          ref: refs/merge-requests/${{ inputs.pr_id }}/merge
      - name: checkout_default_scripts
        uses: checkout
        with:
          ref: ${{ inputs.default_branch }}
          path: base-scripts
      - name: ut
        run: |-
          export branch="${{ inputs.branch }}"
          if [ -f .gitcode/scripts/ut_ci.sh ]; then
            sh .gitcode/scripts/ut_ci.sh
          elif [ -f base-scripts/.gitcode/scripts/ut_ci.sh ]; then
            sh base-scripts/.gitcode/scripts/ut_ci.sh
          else
            echo "ERROR: ut_ci.sh 在预合入代码和基分支中均不存在"; exit 1
          fi
